# UMH data models for the S7Comm simulator — one per machine type.
#
# Paste this whole block into a umh-core config.yaml alongside `agent:`,
# `dataFlow:` / `protocolConverter:`. Only the two built-in payload shapes
# (timeseries-number, timeseries-string) are used, so there is no
# `payloadShapes:` section to add and nothing else to declare.
#
# ---------------------------------------------------------------------------
# Shape: a flat core, then grouped process values
# ---------------------------------------------------------------------------
# The first eight fields are FLAT and IDENTICAL in every model, so one query
# works across every asset regardless of machine type:
#
#   mode  state  fault_active  warning_active  fault_code
#   good_count  scrap_count  part_count
#
# Everything machine-specific is grouped (spindle, coolant, tool, chamber,
# bath, pump, batch, ...). A group becomes the tag's **virtual_path**, so
# `spindle: { speed_rpm: ... }` lands as virtual_path `spindle`, tag_name
# `speed_rpm`, i.e. topic suffix `.../spindle/speed_rpm`. Group names are the
# only thing to set in the bridge beyond the tag name.
#
# ---------------------------------------------------------------------------
# Enum codes — mode and state are NUMBERS, deliberately
# ---------------------------------------------------------------------------
# The PLC serves both as INT codes. Modelling them as timeseries-string would
# make every one of those messages fail schema validation (the string subject
# requires value: string), and a plain address-to-tag bridge has nowhere to
# translate. Numbers keep the bridge a pure mapping; render the names in
# Grafana with value mappings, which is where you want them anyway.
# ---------------------------------------------------------------------------
#   mode   0 auto        1 manual      2 setup
#   state  0 idle        10 running    20 setup       30 fault      40 stopped
#          50 charging   51 heating    52 soaking     53 quenching  54 discharging
#          60 filling    61 washing    62 rinsing     63 drying     64 draining
#          70 tool_change
#
# The payload shape of every field is dictated by the S7 type, not by taste:
# benthos-umh's s7comm converter (s7comm_plugin/type_conversions.go) returns a
# Go bool for an X (bit) address, int16/int32/float32 for I/DI/R, and a string
# for C/S. So the two bit addresses MUST be timeseries-boolean; declaring them
# as numbers makes the uns output reject every message with
# "datatype mismatch ... want timeseries-number, got timeseries-boolean".
# tools/gen-bridge-csv.py enforces this mapping.
#
# The S7 address each field comes from is in the comment beside it. Field
# counts match the address counts exactly: 10 / 17 / 16 / 16.
#
# Version: v3.
#   v1  flat, mode/state as strings
#   v2  grouped, mode/state as strings  -> unusable from a plain CSV bridge:
#       the PLC serves INT codes and the string subject requires value: string
#   v3  grouped, numeric — but declared the two bit addresses as numbers, and
#       the s7comm plugin sends them as Go bools, so they were rejected
#   v4  grouped, with the two bit addresses as timeseries-boolean  <- this file
#
# Each of those is a new version rather than an edit, and that is not
# bookkeeping. umh-core's registry reconcile (pkg/service/redpanda/
# schema_registry.go, compare phase) matches on the subject NAME only and never
# compares schema content: a subject that already exists is left exactly as it
# is. Editing a version in place therefore leaves the old schema registered and
# the uns output keeps rejecting messages. Bumping the version makes the old
# subjects unexpected, so the same reconcile deletes them for you.

# ============================================================================
# timeseries-boolean is declared explicitly. umh-core injects only
# timeseries-number and timeseries-string as defaults in some versions
# (pkg/datamodel/validator.go, ensureDefaultPayloadShapes), and the injector
# never overrides a shape that is already defined — so declaring it here works
# on every version. Paste this block along with dataModels:.
# ============================================================================
payloadShapes:
  timeseries-boolean:
    description: "Boolean time-series value, same envelope as the built-in shapes"
    fields:
      timestamp_ms:
        _type: number
      value:
        _type: boolean

dataModels:

  # ==========================================================================
  # generic — the plain machine: one part per cycle, no alarms.
  # Deliberately all flat: it has no subsystems worth grouping.
  # ==========================================================================
  - name: generic
    description: "S7 simulator, generic machine — flat core only (10 tags)"
    version:
      v4:
        structure:
          mode:                      # DB1.I0    0 auto | 1 manual | 2 setup
            _payloadshape: timeseries-number
          state:                     # DB1.I2    see the code table above
            _payloadshape: timeseries-number
          fault_active:              # DB1.X12.0 BOOL
            _payloadshape: timeseries-boolean
          warning_active:            # DB1.X12.1 BOOL
            _payloadshape: timeseries-boolean
          fault_code:                # DB1.I24   0 = none
            _payloadshape: timeseries-number
          good_count:                # DB1.DI16  monotonic
            _payloadshape: timeseries-number
          scrap_count:               # DB1.DI20  monotonic
            _payloadshape: timeseries-number
          part_count:                # DB1.DI28  monotonic; the per-part join key
            _payloadshape: timeseries-number
          temp_c:                    # DB1.R4
            _payloadshape: timeseries-number
          speed_rpm:                 # DB1.DI8
            _payloadshape: timeseries-number

  # ==========================================================================
  # cnc — milling centre.
  #
  # measurement.diameter_mm and coolant.pressure_bar are both resampled once
  # per part and then HELD, so join them on part_count rather than on time.
  # Diameter drifts with tool wear and resets at the tool change; every
  # scrapped part is one that measured outside 25.000 +/- 0.050 mm.
  # ==========================================================================
  - name: cnc
    description: "S7 simulator, milling centre — flat core + spindle/feed/tool/coolant/measurement (17 tags)"
    version:
      v4:
        structure:
          # --- flat core ---------------------------------------------------
          mode:                      # DB1.I0
            _payloadshape: timeseries-number
          state:                     # DB1.I2    running | tool_change | fault | ...
            _payloadshape: timeseries-number
          fault_active:              # DB1.X12.0
            _payloadshape: timeseries-boolean
          warning_active:            # DB1.X12.1
            _payloadshape: timeseries-boolean
          fault_code:                # DB1.I24   101 tool break | 102 coolant low | 103 spindle overload
            _payloadshape: timeseries-number
          good_count:                # DB1.DI16
            _payloadshape: timeseries-number
          scrap_count:               # DB1.DI20
            _payloadshape: timeseries-number
          part_count:                # DB1.DI28  changes only when a part completes
            _payloadshape: timeseries-number
          # --- grouped -----------------------------------------------------
          spindle:
            speed_rpm:               # DB1.DI8   ~8000 while cutting, 0 otherwise
              _payloadshape: timeseries-number
            load_pct:                # DB1.R48   rises as the tool wears
              _payloadshape: timeseries-number
            temp_c:                  # DB1.R4    rises as the tool wears
              _payloadshape: timeseries-number
          feed:
            rate_mm_min:             # DB1.R52
              _payloadshape: timeseries-number
          tool:
            number:                  # DB1.I44   +1 per tool change
              _payloadshape: timeseries-number
            life_pct:                # DB1.I46   100 -> 0 across 40 parts
              _payloadshape: timeseries-number
          coolant:
            pressure_bar:            # DB1.R36   per part, held; a capable process
              _payloadshape: timeseries-number
            level_pct:               # DB1.R40   depletes over a tool life
              _payloadshape: timeseries-number
          measurement:
            diameter_mm:             # DB1.R32   per part, held; nominal 25.000 tol +/-0.050
              _payloadshape: timeseries-number

  # ==========================================================================
  # oven — hardening furnace. Batch process: good_count and scrap_count stay
  # flat for a whole charge, then jump by batch.size on discharge, published
  # while batch.number still names the charge that produced them.
  # ==========================================================================
  - name: oven
    description: "S7 simulator, hardening furnace — flat core + chamber/atmosphere/batch (16 tags)"
    version:
      v4:
        structure:
          # --- flat core ---------------------------------------------------
          mode:                      # DB1.I0
            _payloadshape: timeseries-number
          state:                     # DB1.I2    charging | heating | soaking | quenching | discharging
            _payloadshape: timeseries-number
          fault_active:              # DB1.X12.0
            _payloadshape: timeseries-boolean
          warning_active:            # DB1.X12.1
            _payloadshape: timeseries-boolean
          fault_code:                # DB1.I24   201 over-temperature | 202 door interlock | 203 atmosphere
            _payloadshape: timeseries-number
          good_count:                # DB1.DI16  jumps by the whole charge
            _payloadshape: timeseries-number
          scrap_count:               # DB1.DI20  a ruined charge lands here in full
            _payloadshape: timeseries-number
          part_count:                # DB1.DI28
            _payloadshape: timeseries-number
          # --- grouped -----------------------------------------------------
          chamber:
            temp_c:                  # DB1.R4    ramps to setpoint, holds, quenches
              _payloadshape: timeseries-number
            setpoint_temp_c:         # DB1.R32   860
              _payloadshape: timeseries-number
            heater_power_pct:        # DB1.R36
              _payloadshape: timeseries-number
            fan_speed_rpm:           # DB1.DI8   circulation fan, 0 when not running
              _payloadshape: timeseries-number
          atmosphere:
            carbon_potential_pct:    # DB1.R40   %C; drifts out of band -> warning 203
              _payloadshape: timeseries-number
          batch:
            number:                  # DB1.DI44  names the charge the jump belongs to
              _payloadshape: timeseries-number
            size:                    # DB1.I48   200
              _payloadshape: timeseries-number
            phase_remaining_s:       # DB1.I50
              _payloadshape: timeseries-number

  # ==========================================================================
  # washing — basket washer. Books ~30 parts per basket. Its alarms are the
  # bath itself: detergent depletes, contamination climbs until the filter
  # clogs and forces a bath change that resets both.
  # ==========================================================================
  - name: washing
    description: "S7 simulator, basket washer — flat core + bath/pump/basket (16 tags)"
    version:
      v4:
        structure:
          # --- flat core ---------------------------------------------------
          mode:                      # DB1.I0
            _payloadshape: timeseries-number
          state:                     # DB1.I2    filling | washing | rinsing | drying | draining
            _payloadshape: timeseries-number
          fault_active:              # DB1.X12.0
            _payloadshape: timeseries-boolean
          warning_active:            # DB1.X12.1
            _payloadshape: timeseries-boolean
          fault_code:                # DB1.I24   301 detergent low | 302 filter clogged | 303 pump pressure low
            _payloadshape: timeseries-number
          good_count:                # DB1.DI16  jumps by the basket
            _payloadshape: timeseries-number
          scrap_count:               # DB1.DI20
            _payloadshape: timeseries-number
          part_count:                # DB1.DI28
            _payloadshape: timeseries-number
          # --- grouped -----------------------------------------------------
          bath:
            temp_c:                  # DB1.R4    60 setpoint, dips on fill
              _payloadshape: timeseries-number
            conductivity_us_cm:      # DB1.R36   climbs to 1200, resets on bath change
              _payloadshape: timeseries-number
            detergent_level_pct:     # DB1.R40   depletes, tops up on bath change
              _payloadshape: timeseries-number
          pump:
            speed_rpm:               # DB1.DI8   0 unless washing or rinsing
              _payloadshape: timeseries-number
            pressure_bar:            # DB1.R32   ~3.2, sags before a pump alarm
              _payloadshape: timeseries-number
            flow_rate_l_min:         # DB1.R44
              _payloadshape: timeseries-number
          basket:
            number:                  # DB1.DI48  names the basket the jump belongs to
              _payloadshape: timeseries-number
            phase_remaining_s:       # DB1.I52
              _payloadshape: timeseries-number
