services:
  s7-simulator:
    build: .
    container_name: s7-simulator
    # Map host 1102 -> container 102 to avoid needing root for a low port on
    # the host. Point benthos at <host>:1102. If you prefer the real S7 port,
    # change to "102:102".
    ports:
      - "1102:102"
    environment:
      # generic | cnc | oven | washing. The profile carries its own sensible
      # process constants, so this is normally the only thing worth setting.
      S7_MACHINE_TYPE: "generic"
      S7_UPDATE_INTERVAL: "1.0"
      # Seconds per machine cycle. Leave unset to take the profile's default
      # (generic 60, cnc 45, oven 300, washing 120); turn it down to
      # fast-forward the whole simulation, alarms included.
      # S7_CYCLE_TIME: "60"
    restart: unless-stopped
