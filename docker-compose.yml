services:
  s7-simulator:
    build: .
    container_name: s7-simulator
    # Map host 1102 -> container 102 to avoid needing root for a low port on
    # the host. Point benthos at <host>:1102. If you prefer the real S7 port,
    # change to "102:102".
    ports:
      - "1102:102"
    environment:
      S7_UPDATE_INTERVAL: "1.0"
      # Seconds of auto-mode runtime per part. 60 => 1 part/minute.
      S7_CYCLE_TIME: "60"
      # Other knobs (see README): S7_SCRAP_RATE (default 0.05),
      # S7_COUNTER_MAX (default 2147483647 — lower it to test counter rollover).
    restart: unless-stopped
